name: freezer_map
description: "Offline, local-first freezer inventory and planning app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.2 <3.14.0'

dependencies:
  decimal: ^3.2.6
  drift: ^2.34.3
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.3
  flutter_timezone: ^3.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  timezone: ^0.9.4
  unorm_dart: ^0.3.2

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  file_picker_platform_interface: ^3.3.0
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
